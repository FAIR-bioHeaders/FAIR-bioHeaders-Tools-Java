name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Primary acceptance: the released contracts, read natively. No Python, no pip, no reference
  # toolkit anywhere in this job - the only inputs are the JDK, Maven, this repository and a
  # read-only checkout of the specification's language-neutral conformance data.
  build:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.os }}-${{ matrix.java }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ matrix.os }}-${{ matrix.java }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Acceptance comes from the shared, language-neutral conformance suite; pinned to the
      # released tag whose manifest this library's results were recorded against (docs/STATUS.md).
      # Bump deliberately with a schema release, never as drive-by drift.
      - name: Check out FAIR-bioHeaders-Specification at v0.6.0
        uses: actions/checkout@v4
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: v0.6.0
          path: fair-bioheaders-specification

      - name: Assert the acceptance path is native
        run: |
          # This job's acceptance path is Java only: the JDK, Maven, this repository's sources and
          # a read-only checkout of the specification's language-neutral data. The check is that
          # nothing in the build or the tests can invoke another implementation - no subprocess from
          # any source file, no interpreter plugin in the POM, and no foreign project file in the
          # tree that a test could reach for. The reference toolkit is never a dependency here; the
          # Python differentials in docs/STATUS.md were recorded once, outside CI.
          set -e
          if grep -rn -E "ProcessBuilder|Runtime\.getRuntime\(\)|getRuntime\(\)\.exec|System\.loadLibrary|javax\.script|ScriptEngine" src/ ; then
            echo "^ native acceptance must not shell out to, embed or load another implementation" >&2
            exit 1
          fi
          if grep -n -E "exec-maven-plugin|ant|groovy|python" pom.xml ; then
            echo "^ the build must not wire in a foreign interpreter plugin" >&2
            exit 1
          fi
          for f in requirements.txt pyproject.toml setup.py environment.yml Pipfile Cargo.toml package.json DESCRIPTION NAMESPACE Project.toml; do
            if [ -e "$f" ]; then
              echo "unexpected foreign project file in a Java library: $f" >&2
              exit 1
            fi
          done
          # And after the run: nothing in the workspace was produced by an interpreter.
          found=$(find . -name '*.pyc' -o -name '__pycache__' -o -name '.pytest_cache' \
              -o -name 'Rplots.pdf' -o -name '*.rds' -o -name 'Manifest.toml' -o -name 'Project.toml' \
              | grep -v '^./.git/' || true)
          if [ -n "$found" ]; then
            echo "foreign runtime output appeared in the workspace: $found" >&2
            exit 1
          fi
          echo "no subprocess use, no foreign interpreter plugin, no foreign project files," \
            "no foreign runtime output"

      - name: Test (unit + shared conformance vectors, released contracts only)
        run: >
          ./mvnw -B -ntp test
          -DexcludedGroups=draft
          -Dfh.spec.dir=${{ github.workspace }}/fair-bioheaders-specification

      - name: Assert the vector tests actually ran (not silently skipped)
        run: |
          count=$(grep -h 'tests=' target/surefire-reports/TEST-org.fairbioheaders.conformance.FileVectorTest.xml | head -1 | sed -E 's/.*tests="([0-9]+)".*/\1/')
          echo "FileVectorTest executed $count tests"
          if [ "$count" -lt 228 ]; then
            echo "expected all 228 embedded-header vectors to run (got $count)" >&2
            exit 1
          fi

      # The registry refactor (PR #4) promises that the default reading is unchanged. That is only
      # evidence if the comparison ran against the vectors too, so the receipt the golden test
      # writes is asserted here rather than trusted from a green build.
      - name: Assert the default-behavior golden compared everything
        run: |
          receipt=target/default-behavior-golden.properties
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - DefaultBehaviorGoldenTest did not run" >&2
            exit 1
          fi
          cat "$receipt"
          for pair in vectorsCompared=228 documentsCompared=47 selectionCasesCompared=304 kindsCompared=18; do
            key=${pair%%=*}; want=${pair##*=}
            got=$(sed -n "s/^$key=//p" "$receipt")
            if [ "$got" != "$want" ]; then
              echo "$key=$got, expected $want" >&2
              exit 1
            fi
          done

      - name: Assert nothing was skipped and no report is empty
        run: |
          # Zero-test and skip guards: a green build with a quiet skip is not acceptance.
          sh .github/scripts/assert-reports.sh 318

      # The ledger is the completeness claim: all 291 shared vectors accounted for, 228 run here,
      # 63 declared not-run with a reason each. A stale declared count fails the build.
      # The ledger is the completeness claim: all 291 shared vectors accounted for, 228 run here,
      # 63 declared not-run each with its reason (checked in Java by AcceptanceLedgerTest). A stale
      # declared count is a build failure, never a quiet pass. Fixed-string line comparison, so no
      # value here is produced by parsing the file it is checking.
      - name: Assert the acceptance ledger accounts for every shared vector
        run: |
          receipt=target/acceptance-ledger.properties
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - AcceptanceLedgerTest did not run" >&2
            exit 1
          fi
          cat "$receipt"
          cat > "${RUNNER_TEMP:-target}/ledger-expected.txt" <<'EXPECTED'
          available=true
          vectorsTotal=291
          vectorsRun=228
          vectorsPassed=228
          vectorsFailed=0
          vectorsNotRun=63
          vectorsDeclaredNotRunWithReason=63
          fasta=98/98 passed, 0 not run
          gfa=56/56 passed, 0 not run
          fhp-fasta=36/36 passed, 0 not run
          fhgff3=38/38 passed, 0 not run
          microdata=0/26 passed, 26 not run
          jsonld=0/37 passed, 37 not run
          EXPECTED
          missing=0
          while IFS= read -r line; do
            grep -qxF "$line" "$receipt" || { echo "ledger: no '$line' line" >&2; missing=1; }
          done < "${RUNNER_TEMP:-target}/ledger-expected.txt"
          if [ "$missing" -ne 0 ]; then
            echo "the acceptance ledger does not match the declared v0.6.0 baseline" >&2
            exit 1
          fi

      - name: Package
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: error

  # Rule V7 evidence, separate and labelled: the FHT development contract and its own vector suite.
  # Still native (JDK + Maven only), still no Python. A pass here is "the pinned draft bytes behave
  # as their own suite expects", never "FHT is supported": FHT has no released contract, no
  # schemaVersion row and no w3id URL (docs/CAPABILITY-MATRIX.md).
  draft-vectors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # The suite revision the registry pins (schemas/bundled.json drafts entry "suiteCommit").
      # The contract bytes themselves are inside this jar and re-digest-checked at run time, so a
      # checkout that no longer matches the pin fails the job instead of reporting stale evidence.
      - name: Check out FHT-Specification at the pinned suite commit
        uses: actions/checkout@v4
        with:
          repository: FAIR-bioHeaders/FHT-Specification
          ref: be9bcc825f55db92852fd882ffba4c1c214f53db
          path: fht-specification

      - name: Check out FHGM-Specification at the pinned suite commit
        uses: actions/checkout@v4
        with:
          repository: FAIR-bioHeaders/FHGM-Specification
          ref: 57118c52363990dcaa42640394db84acb089cc24
          path: fhgm-specification

      - name: Test the rule V7 draft lane
        run: >
          ./mvnw -B -ntp test
          -Dgroups=draft
          -Dfh.fht.dir=${{ github.workspace }}/fht-specification/conformance
          -Dfh.fhgm.dir=${{ github.workspace }}/fhgm-specification/development/conformance

      - name: Assert the draft suite ran in full, against the pinned bytes
        run: |
          # Counts are checked here; the identity of what was measured (contract commit + digest,
          # suite commit + manifest digest, the checkout's own bytes) is checked inside the Java
          # run: DraftHarness re-digests the checkout against the registry pin before it will read
          # a single vector, and DraftProvenanceTest pins the registry values themselves. The
          # literals below are a second statement of the same pin, so drift in either place fails.
          receipt=target/fht-draft-vectors.properties
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - DraftLedgerTest did not run" >&2
            exit 1
          fi
          cat "$receipt"
          # Digest first, count second: the suite pins below are SHA-256s of the manifest bytes;
          # the counts beside them are a second, weaker statement of the same revision.
          grep -qx 'vectorsInManifest=72' "$receipt" || { echo "expected 72 vectors in the manifest" >&2; exit 1; }
          grep -qx 'vectorsRan=72' "$receipt" || { echo "expected 72 draft vectors to run" >&2; exit 1; }
          grep -qx 'vectorsPassed=72' "$receipt" || { echo "expected 72 draft vectors to pass" >&2; exit 1; }
          grep -qx 'contractCommit=226f923c28b680edb3c546e99a751482d06aef1a' "$receipt" \
            || { echo "the draft suite did not run against the pinned contract commit" >&2; exit 1; }
          grep -qx 'contractSha256=59ad9641adcb0e5591045c2d894c066d1adc9984cca84c5ff6502f8dad88487e' "$receipt" \
            || { echo "the draft suite did not run against the pinned contract digest" >&2; exit 1; }
          grep -qx 'suiteCommit=be9bcc825f55db92852fd882ffba4c1c214f53db' "$receipt" \
            || { echo "the suite is not the pinned revision" >&2; exit 1; }
          grep -qx 'suiteManifestSha256=9fd8c0b2a4638d5ddc0bf9b5d1e96c66778b26bcf8f93975aafb707d8f2b702c' "$receipt" \
            || { echo "the suite manifest is not the pinned digest" >&2; exit 1; }
          grep -qx 'note=' "$receipt" || { echo "the receipt carries a note: $receipt" >&2; exit 1; }
          count=$(grep -h 'tests=' target/surefire-reports/TEST-org.fairbioheaders.conformance.FhtDraftVectorTest.xml | head -1 | sed -E 's/.*tests="([0-9]+)".*/\1/')
          echo "FhtDraftVectorTest executed $count tests"
          [ "$count" -eq 72 ] || { echo "expected 72 FHT draft vectors to run (got $count)" >&2; exit 1; }

      - name: Assert the FHGM draft suite ran in full, against the pinned bytes
        run: |
          # Same discipline as FHT: counts here, identity inside the Java run (FhgmHarness re-digests
          # the checkout's record contract, transport overlay and manifest against the registry pins,
          # and every vector's own recorded bytes, before it reports anything).
          receipt=target/fhgm-draft-vectors.properties
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - DraftLedgerTest did not run" >&2
            exit 1
          fi
          cat "$receipt"
          # Digest first, count second: this suite is the proof. Its manifest passed through
          # 36 001 bytes with the vector count still 31 on the way to 51 114 bytes / 43 vectors
          # (measured 2026-11-15 from the manifest's own history) - a count-only assertion would
          # have reported that step as no drift at all.
          grep -qx 'vectorsInManifest=43' "$receipt" || { echo "expected 43 FHGM vectors in the manifest" >&2; exit 1; }
          grep -qx 'vectorsRan=43' "$receipt" || { echo "expected 43 FHGM draft vectors to run" >&2; exit 1; }
          grep -qx 'vectorsPassed=43' "$receipt" || { echo "expected 43 FHGM draft vectors to pass" >&2; exit 1; }
          grep -qx 'recordContractCommit=ac3d37b3033312844fc3151217731928ae33aa54' "$receipt" \
            || { echo "not the pinned FHGM record contract commit" >&2; exit 1; }
          grep -qx 'recordContractSha256=bf1553cac04dc88d8afaff1d39bc50360342e1ebedac4b73dfe3dff570ff410f' "$receipt" \
            || { echo "not the pinned FHGM record contract digest" >&2; exit 1; }
          grep -qx 'transportContractCommit=5d15ccc122fcb8239787393010364a818a774ee4' "$receipt" \
            || { echo "not the pinned FHGM transport overlay commit" >&2; exit 1; }
          grep -qx 'transportContractSha256=d1619cced91b4ef554853bf5512b5b4ad593b1dc571c2beacb5ee92466ea244a' "$receipt" \
            || { echo "not the pinned FHGM transport overlay digest" >&2; exit 1; }
          grep -qx 'suiteCommit=57118c52363990dcaa42640394db84acb089cc24' "$receipt" \
            || { echo "not the pinned FHGM suite revision" >&2; exit 1; }
          grep -qx 'suiteManifestSha256=0d2790151c4a29551e9b92fb6b3c3c62ea062f2889ffbd00b3c425e7b6da3458' "$receipt" \
            || { echo "the FHGM suite manifest is not the pinned digest" >&2; exit 1; }
          grep -q '^gff3Layer=skipped' "$receipt" \
            || { echo "the skipped GFF3 layer must be stated in the receipt" >&2; exit 1; }
          count=$(grep -h 'tests=' target/surefire-reports/TEST-org.fairbioheaders.conformance.FhgmDraftVectorTest.xml | head -1 | sed -E 's/.*tests="([0-9]+)".*/\1/')
          echo "FhgmDraftVectorTest executed $count tests"
          [ "$count" -eq 43 ] || { echo "expected 43 FHGM draft vectors to run (got $count)" >&2; exit 1; }

      - name: Assert nothing was skipped in the draft job
        run: sh .github/scripts/assert-reports.sh 199

      - name: Upload draft reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-reports-java${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/fht-draft-vectors.properties
            target/fhgm-draft-vectors.properties
          if-no-files-found: error

  # Draft-pin freshness, the check that earns its keep (workspace guide): the recorded commit and
  # SHA-256 against the owning repository's live raw-main bytes. Advisory by design - a moved
  # draft must be re-pinned deliberately, and released acceptance never depends on it - so this
  # job reports the drift loudly without gating the released-contract result.
  draft-pin-freshness:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pinned draft bytes with live raw main
        run: |
          # Every draft this jar registers, checked three ways: the digest recorded in the registry,
          # the bytes shipped inside this jar, and the owning repository's live raw main. Values are
          # read per registry row (sed over the row's own block), never by positional grep over the
          # whole file, so adding a draft cannot silently re-point the check at the wrong one.
          set -e
          registry=src/main/resources/org/fairbioheaders/schemas/bundled.json
          dir=src/main/resources/org/fairbioheaders/schemas
          control=$(curl -s -o /dev/null -w '%{http_code}' \
            https://raw.githubusercontent.com/FAIR-bioHeaders/FHT-Specification/main/no-such-file.json)
          echo "control (expect 404): $control"
          [ "$control" = "404" ] || { echo "probe control failed; any result below is meaningless" >&2; exit 1; }
          drift=0
          for key in FHT FHGM; do
            row=$(sed -n "/\"fileKey\": \"$key\"/,/^    }$/p" "$registry")
            url=$(printf '%s' "$row" | grep -oE '"citation": "https[^"]*"' | head -1 | cut -d'"' -f4)
            pin=$(printf '%s' "$row" | grep -oE '"sha256": "[0-9a-f]{64}"' | head -1 | cut -d'"' -f4)
            file=$(printf '%s' "$row" | grep -oE '"file": "[^"]*"' | head -1 | cut -d'"' -f4)
            commit=$(printf '%s' "$row" | grep -oE '"commit": "[0-9a-f]{40}"' | head -1 | cut -d'"' -f4)
            echo "--- $key"
            echo "    pinned  : $pin (commit $commit)"
            [ -n "$url" ] && [ -n "$pin" ] && [ -n "$file" ] || { echo "$key: registry fields missing" >&2; exit 1; }
            shipped=$(sha256sum "$dir/$file" | cut -d' ' -f1)
            echo "    shipped : $shipped"
            [ "$shipped" = "$pin" ] || { echo "$key: the shipped copy does not match its own pin" >&2; exit 1; }
            code=$(curl -s -o "live-$file" -w '%{http_code}' "$url")
            live=$(sha256sum "live-$file" | cut -d' ' -f1)
            echo "    live    : $live (HTTP $code from $url)"
            [ "$code" = "200" ] || { echo "$key: citation did not resolve" >&2; exit 1; }
            if [ "$live" != "$pin" ]; then
              echo "::warning title=Stale $key draft pin::$key raw main now has sha256 $live; this jar pins $pin (commit $commit). Re-pin deliberately (issue #2)."
              drift=1
            fi
          done
          if [ "$drift" = "1" ]; then
            echo "at least one pinned draft revision is no longer the owning repository's main: the reading"
            echo "stays valid evidence about the pinned commit, and about nothing newer"
          else
            echo "both pins are current"
          fi
