name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.java }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ matrix.java }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Acceptance comes from the shared, language-neutral conformance suite;
      # pinned to the released tag whose manifest this library's results were
      # recorded against (docs/STATUS.md). Bump deliberately with a schema
      # release, never as drive-by drift.
      - name: Check out FAIR-bioHeaders-Specification at v0.6.0
        uses: actions/checkout@v4
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: v0.6.0
          path: fair-bioheaders-specification

      - name: Test (unit + shared conformance vectors)
        run: >
          ./mvnw -B -ntp test
          -Dfh.spec.dir=${{ github.workspace }}/fair-bioheaders-specification

      - name: Assert the vector tests actually ran (not silently skipped)
        run: |
          count=$(grep -h 'tests=' target/surefire-reports/TEST-org.fairbioheaders.conformance.FileVectorTest.xml | head -1 | sed -E 's/.*tests="([0-9]+)".*/\1/')
          echo "FileVectorTest executed $count tests"
          if [ "$count" -lt 228 ]; then
            echo "expected all 228 embedded-header vectors to run (got $count)" >&2
            exit 1
          fi

      - name: Package
        run: ./mvnw -B -ntp -DskipTests package
